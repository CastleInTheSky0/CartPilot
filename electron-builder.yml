appId: dev.cartpilot.desktop
productName: CartPilot
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - out/main/**/*
  - node_modules/playwright/**/*
  - node_modules/playwright-core/**/*
  - node_modules/better-sqlite3/**/*
extraResources:
  - from: migrations
    to: migrations
    filter:
      - "**/*"
npmRebuild: true
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: CartPilot
  artifactName: CartPilot-${version}-${arch}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
